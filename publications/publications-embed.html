<!--
  Google Scholar Publications Embed
  ----------------------------------
  Paste this block into your site's "Publications" page, at the spot
  where you want the auto-updating publication list to appear.

  It fetches data/publications.html (generated automatically by the
  GitHub Action) and injects it into the page.
-->

<div id="scholar-publications">
  <p style="opacity:0.6;">Loading publications…</p>
</div>

<style>
  .publications-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .pub-item {
    padding: 16px 0;
    border-bottom: 1px solid #e5e5e5;
  }
  .pub-item:last-child {
    border-bottom: none;
  }
  .pub-title {
    font-weight: 600;
    font-size: 1.1em;
    text-decoration: none;
    color: #1a0dab;
    display: block;
  }
  .pub-title:hover {
    text-decoration: underline;
  }
  .pub-authors {
    margin-top: 4px;
    font-size: 0.92em;
    color: #444;
  }
  .pub-venue {
    margin-top: 2px;
    font-size: 0.9em;
    color: #777;
    font-style: italic;
  }
</style>

<script>
  // Fetch the auto-generated publications fragment and inject it into the page.
  // This assumes data/publications.html sits at the site root, e.g.
  // https://mansoorrafiei.github.io/data/publications.html
  fetch('/data/publications.html')
    .then(function (response) {
      if (!response.ok) {
        throw new Error('Network response was not ok: ' + response.status);
      }
      return response.text();
    })
    .then(function (html) {
      document.getElementById('scholar-publications').innerHTML = html;
    })
    .catch(function (error) {
      document.getElementById('scholar-publications').innerHTML =
        '<p style="color:#c00;">Could not load publications right now. Please try again later.</p>';
      console.error('Error loading publications:', error);
    });
</script>
